# https://circleci.com/developer/orbs/orb/circleci/ruby
version: 2.1

# https://circleci.com/developer/orbs/orb/circleci/ruby
orbs:
  ruby: circleci/ruby@2.1.0

jobs:
  build:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout
      - ruby/install-deps

  test:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - restore_cache:
          keys:
            - simulator-routes-v1-{{ checksum "app/services/trip_simulator/pool.rb" }}
      - run:
          name: Start PostgreSQL shards and PgDog
          command: docker compose -p rideshare-ci -f .circleci/docker-compose.yml up -d --build --wait primary shard_0 shard_1 pgdog
      - run:
          name: Build Rails test client
          command: docker compose -p rideshare-ci -f .circleci/docker-compose.yml build test
      - run:
          name: Convert test databases and run suite
          command: |
            docker compose -p rideshare-ci -f .circleci/docker-compose.yml run --rm test sh -c '
              set -e
              bin/rails db:prepare
              bin/rails generate uuid_conversion
              bin/rails db:migrate db:schema:dump
              test -f db/simulator_routes.json || ruby bin/generate_simulator_routes
              bin/rails test
            '
      - save_cache:
          key: simulator-routes-v1-{{ checksum "app/services/trip_simulator/pool.rb" }}
          paths:
            - db/simulator_routes.json
      - run:
          name: Collect Docker logs
          when: always
          command: docker compose -p rideshare-ci -f .circleci/docker-compose.yml logs --no-color > /tmp/pgdog-ci.log
      - store_artifacts:
          path: /tmp/pgdog-ci.log
      - run:
          name: Stop disposable databases
          when: always
          command: docker compose -p rideshare-ci -f .circleci/docker-compose.yml down --volumes

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
