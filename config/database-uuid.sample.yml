# Optional isolated databases for the UUID branch. Copy to config/database.yml.
default: &default
  adapter: postgresql
  schema_search_path: rideshare
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>

development:
  <<: *default
  url: <%= ENV.fetch('UUID_DEVELOPMENT_DATABASE_URL', 'postgresql://postgres:postgres@localhost:5432/rideshare_uuid_development') %>

test:
  <<: *default
  url: <%= ENV.fetch('UUID_TEST_DATABASE_URL', 'postgresql://postgres:postgres@localhost:5432/rideshare_uuid_test') %>
