#
# Configuring Active Record:
# <https://guides.rubyonrails.org/configuring.html#configuring-active-record>
#
# Database Connection Control Functions
# <https://www.postgresql.org/docs/current/libpq-connect.html>
#
default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  schema_search_path: rideshare
  prepared_statements: true # enabled by default
  advisory_locks: true # enabled by default
  # Optional (PostgreSQL):
  # checkout_timeout, read_timeout

development:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    database: rideshare_development
    variables:
      statement_timeout: 20000
      idle_in_transaction_session_timeout: 300000
  pgdog: &pgdog
    <<: *default
    url: <%= ENV.fetch('PGDOG_DATABASE_URL', 'postgresql://postgres:postgres@localhost:6432/rideshare_dev_sharded') %>
    migrations_paths: db/pgdog_migrate

test:
  primary:
    <<: *default
    url: <%= ENV.fetch('TEST_DATABASE_URL', 'postgresql://postgres:@localhost/rideshare_test') %>
  pgdog:
    <<: *pgdog
    url: <%= ENV.fetch('PGDOG_TEST_DATABASE_URL', 'postgresql://postgres:postgres@localhost:6432/rideshare_test_sharded') %>
