services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://owner:@localhost:5432/rideshare_development
      RAILS_ENV: development
      BUNDLE_PATH: /bundle
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    stdin_open: true
    tty: true

volumes:
  pgdata:
